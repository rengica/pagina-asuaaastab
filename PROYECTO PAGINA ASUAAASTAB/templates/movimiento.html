<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Movimiento - ASUAAASTAB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('inventario') }}" class="btn-volver">← Volver al Inventario</a>
        <h2>Registrar Entrada / Salida de Material</h2>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="form-card">
            <h3>Formulario de Movimiento de Almacén</h3>
            <form action="{{ url_for('registrar_movimiento') }}" method="POST">
                <div class="form-group">
                    <label for="producto_id">Insumo / Producto:</label>
                    <select name="producto_id" id="producto_id" required>
                        <option value="">-- Seleccione un insumo --</option>
                        {% for prod in productos %}
                            <option value="{{ prod.id }}">
                                {{ prod.codigo }} - {{ prod.nombre }} (Disponible: {{ prod.stock_actual }} {{ prod.unidad_medida }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de Operación:</label>
                    <select name="tipo" id="tipo" required>
                        <option value="ENTRADA">ENTRADA (Ingreso a almacén)</option>
                        <option value="SALIDA">SALIDA (Entrega a campo/obra)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cantidad">Cantidad:</label>
                    <input type="number" step="0.01" min="0.01" name="cantidad" id="cantidad" placeholder="Ej. 10" required>
                </div>

                <div class="form-group">
                    <label for="responsable">Responsable / Operario:</label>
                    <input type="text" name="responsable" id="responsable" placeholder="Nombre de quien entrega/recibe" required>
                </div>

                <div class="form-group">
                    <label for="observacion">Observación / Destino:</label>
                    <textarea name="observacion" id="observacion" rows="3" placeholder="Ej. Reparación de fuga Sector Centro"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-guardar">Guardar Movimiento</button>
                    <a href="{{ url_for('inventario') }}" class="btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
