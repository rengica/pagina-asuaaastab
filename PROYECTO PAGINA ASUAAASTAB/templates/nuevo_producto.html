<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto - ASUAAASTAB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('inventario') }}" class="btn-volver">← Volver al Inventario</a>
        <h2>Crear Nuevo Insumo / Producto</h2>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="form-card">
            <h3>Registro de Nuevo Insumo</h3>
            <form action="{{ url_for('crear_producto') }}" method="POST">
                
                <div class="form-group">
                    <label for="codigo">Código del Insumo / SKU:</label>
                    <input type="text" name="codigo" id="codigo" placeholder="Ej. TUB-PVC-02, VAL-BR-01" required>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre del Insumo:</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Ej. Tubo PVC Presión 2 pulgadas" required>
                </div>

                <div class="form-group">
                    <label for="unidad_medida">Unidad de Medida:</label>
                    <select name="unidad_medida" id="unidad_medida" required>
                        <option value="Unidades">Unidades</option>
                        <option value="Metros">Metros</option>
                        <option value="Kilogramos">Kilogramos</option>
                        <option value="Galones">Galones</option>
                        <option value="Kits">Kits</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="estado">Estado del Insumo:</label>
                    <select name="estado" id="estado" required>
                        <option value="Bueno">Bueno</option>
                        <option value="Regular">Regular</option>
                        <option value="Malo">Malo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="stock_inicial">Stock Inicial:</label>
                    <input type="number" step="0.01" min="0" name="stock_inicial" id="stock_inicial" value="0" required>
                </div>

                <div class="form-group">
                    <label for="stock_minimo">Stock Mínimo (Alerta de Reabastecimiento):</label>
                    <input type="number" step="0.01" min="0" name="stock_minimo" id="stock_minimo" value="5" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-guardar">Crear Producto</button>
                    <a href="{{ url_for('inventario') }}" class="btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
