<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Certificación Laboral - ASUAAASTAB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-row .form-group { flex: 1; }
        .oculto { display: none; }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('documentos') }}" class="btn-volver">← Volver a Documentos</a>
        <h2>Generar Certificación Laboral Oficial</h2>
    </header>

    <main class="container">
        <div class="form-card">
            <h3>Datos del Colaborador</h3>
            <form action="{{ url_for('certificacion_laboral') }}" method="POST" target="_blank">
                
                <div class="form-row">
                    <div class="form-group" style="flex: 0.3;">
                        <label for="trato">Trato:</label>
                        <select name="trato" id="trato">
                            <option value="El señor">El señor</option>
                            <option value="La señora">La señora</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="nombre_empleado">Nombre Completo:</label>
                        <input type="text" name="nombre_empleado" id="nombre_empleado" placeholder="Ej. JUAN CAMILO RENGIFO ENRÍQUEZ" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="tipo_doc">Tipo de Documento:</label>
                        <select name="tipo_doc" id="tipo_doc" required>
                            <option value="cédula de ciudadanía">Cédula de Ciudadanía</option>
                            <option value="cédula de extranjería">Cédula de Extranjería</option>
                            <option value="PPT">Permiso por Protección Temporal (PPT)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="numero_doc">Número de Documento:</label>
                        <input type="text" name="numero_doc" id="numero_doc" placeholder="Ej. 1006907608" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cargo_select">Sugerencia de Cargo / Funciones Técnicas:</label>
                        <select id="cargo_select" onchange="actualizarCargoYFunciones(this.value)">
                            <option value="">-- Seleccionar o escribir manual --</option>
                            <option value="Fontanero">Fontanero / Técnico Operativo</option>
                            <option value="Administrador">Administrador General</option>
                            <option value="Auxiliar Administrativo">Auxiliar Administrativo y de Atención al Usuario</option>
                            <option value="Operario de Aseo">Operario de Servicios Generales y Aseo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cargo">Cargo Oficial:</label>
                        <input type="text" name="cargo" id="cargo" placeholder="Ej. Administrador / Fontanero" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="funciones">Funciones Desempeñadas (Perfil Profesional):</label>
                    <textarea name="funciones" id="funciones" rows="5" placeholder="Descripción detallada de actividades y responsabilidades..." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="estado_laboral">Estado de la Vinculación:</label>
                        <select name="estado_laboral" id="estado_laboral" onchange="toggleFechaFin(this.value)" required>
                            <option value="ACTIVO">Actualmente Vinculado (Activo)</option>
                            <option value="FINALIZADO">Vinculación Finalizada (Retirado)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fecha_inicio">Fecha de Inicio:</label>
                        <input type="date" name="fecha_inicio" id="fecha_inicio" required>
                    </div>
                    <div class="form-group oculto" id="grupo_fecha_fin">
                        <label for="fecha_fin">Fecha de Finalización:</label>
                        <input type="date" name="fecha_fin" id="fecha_fin">
                    </div>
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
                <h4>Datos del Firmante</h4>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre_firmante">Nombre del Firmante:</label>
                        <input type="text" name="nombre_firmante" id="nombre_firmante" value="ANGIE RUEDA ERAZO" required>
                    </div>
                    <div class="form-group">
                        <label for="cargo_firmante">Cargo del Firmante:</label>
                        <input type="text" name="cargo_firmante" id="cargo_firmante" value="Representante Legal" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-guardar">Generar Certificación PDF</button>
                    <a href="{{ url_for('documentos') }}" class="btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        const plantillasFunciones = {
            'Fontanero': 'ejecución de actividades técnicas para la operación, mantenimiento preventivo y correctivo de la planta de tratamiento de agua potable (PTAP), inspección y reparación de la red de conducción y distribución, control de calidad del suministro de agua y lectura e instalación de micromedidores',
            'Administrador': 'dirección, planificación y supervisión integral de las operaciones administrativas, financieras y operativas de la asociación; gestión del talento humano, atención a usuarios, control de recaudos y aseguramiento del cumplimiento de la normativa legal de la Superintendencia de Servicios Públicos Domiciliarios (SSPD)',
            'Auxiliar Administrativo': 'apoyo en la gestión documental y de archivo, atención integral a peticiones, quejas, reclamos y sugerencias (PQRSF) de los usuarios, procesamiento de lecturas y soporte en la facturación mensual y cobro de las tarifas del servicio',
            'Operario de Aseo': 'operación de las rutas de recolección y transporte de residuos sólidos domiciliarios, ejecución de labores de saneamiento e higiene comunal y fomento de prácticas de manejo adecuado de residuos con la comunidad'
        };

        function actualizarCargoYFunciones(val) {
            if (val) {
                document.getElementById('cargo').value = val;
                document.getElementById('funciones').value = plantillasFunciones[val] || '';
            }
        }

        function toggleFechaFin(val) {
            const grupoFin = document.getElementById('grupo_fecha_fin');
            const inputFin = document.getElementById('fecha_fin');
            if (val === 'FINALIZADO') {
                grupoFin.classList.remove('oculto');
                inputFin.required = true;
            } else {
                grupoFin.classList.add('oculto');
                inputFin.required = false;
                inputFin.value = '';
            }
        }
    </script>
</body>
</html>
