<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0 fw-bold">Nueva Factura de Venta</h4>
                <a href="{{ url_for('documentos') }}" class="btn btn-outline-light btn-sm">Volver a Documentos</a>
            </div>
            
            <div class="card-body p-4">
                <form action="{{ url_for('factura_venta') }}" method="POST">
                    
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">Consecutivo N°:</label>
                            <input type="text" name="consecutivo" value="{{ consecutivo }}" readonly class="form-control bg-light text-primary fw-bold fs-5">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">Fecha de Expedición:</label>
                            <input type="date" name="fecha" value="{{ datetime }}" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary">Cliente:</label>
                            <input type="text" name="cliente" class="form-control" placeholder="Nombre completo" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary">Cédula de Ciudadanía / NIT:</label>
                            <input type="text" name="documento" class="form-control" placeholder="Número de documento" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary">Dirección:</label>
                            <input type="text" name="direccion" value="El Tablón de Gómez" class="form-control" required>
                        </div>
                    </div>

                    <hr class="my-4 text-muted">

                    <h5 class="fw-bold text-secondary mb-3">Detalle de Productos / Servicios</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle">
                            <thead class="table-secondary text-center">
                                <tr>
                                    <th style="width: 15%;">Cantidad</th>
                                    <th style="width: 55%;">Concepto</th>
                                    <th style="width: 30%;">V. Unitario ($)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for i in range(8) %}
                                <tr>
                                    <td>
                                        <input type="number" step="any" name="cantidad[]" class="form-control text-center" placeholder="1">
                                    </td>
                                    <td>
                                        <input type="text" name="concepto[]" class="form-control" placeholder="Descripción del artículo o servicio {{ i + 1 }}">
                                    </td>
                                    <td>
                                        <input type="number" step="any" name="v_unitario[]" class="form-control text-end" placeholder="0.00">
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>

                    <div class="row justify-content-end my-4">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Vr. Retefuente ($):</label>
                                <input type="number" step="any" name="retefuente" class="form-control text-end" placeholder="0.00">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Rt. Reteica ($):</label>
                                <input type="number" step="any" name="reteica" class="form-control text-end" placeholder="0.00">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3">
                        <a href="{{ url_for('documentos') }}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-success px-4">Generar Factura</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>
</html>
