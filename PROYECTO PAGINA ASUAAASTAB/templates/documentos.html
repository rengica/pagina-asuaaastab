<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Documentos - ASUAAASTAB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .docs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .doc-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .doc-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .doc-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #0056b3;
            margin-bottom: 10px;
        }
        .doc-desc {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 20px;
            flex-grow: 1;
        }
        .btn-generar {
            background-color: #0056b3;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-generar:hover {
            background-color: #003d82;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('inicio') }}" class="btn-volver">← Volver al Inicio</a>
        <h2>Módulo de Generación de Documentos</h2>
    </header>

    <main class="container">
        <h3>Seleccione el documento que desea expedir:</h3>
        
        <div class="docs-grid">
            {% for doc in documentos %}
            <div class="doc-card">
                <div>
                    <div class="doc-icon">{{ doc.icono }}</div>
                    <div class="doc-title">{{ doc.titulo }}</div>
                    <div class="doc-desc">{{ doc.descripcion }}</div>
                </div>
                <a href="{{ url_for(doc.id) }}" class="btn-generar">Generar {{ doc.titulo }}</a>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
