<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado de Servicios Públicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0 fw-bold">Generar Certificado de Servicios Públicos</h4>
                <a href="{{ url_for('documentos') }}" class="btn btn-outline-light btn-sm">Volver a Documentos</a>
            </div>
            
            <div class="card-body p-4">
                <form action="{{ url_for('certificado_servicios') }}" method="POST">
                    
                    <h5 class="text-primary mb-3 border-bottom pb-2">Información del Usuario / Predio</h5>
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-secondary">Trato:</label>
                            <select name="trato_usuario" class="form-select">
                                <option value="El señor" selected>El señor</option>
                                <option value="La señora">La señora</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-bold text-secondary">Nombre Completo del Usuario:</label>
                            <input type="text" name="nombre_usuario" class="form-control" placeholder="Ej: JUAN PÉREZ ROSERO" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary">Cédula / NIT:</label>
                            <input type="text" name="documento" class="form-control" placeholder="Ej: 12.345.678" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary">Código de Usuario / Matrícula:</label>
                            <input type="text" name="codigo_usuario" class="form-control" placeholder="Ej: US-0142" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary">Dirección del Predio:</label>
                            <input type="text" name="direccion_predio" class="form-control" placeholder="Ej: Calle 3 N° 4-12" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold text-secondary">Barrio / Sector:</label>
                            <input type="text" name="barrio" value="Barrio San Francisco" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">Estado del Servicio:</label>
                            <select name="estado_servicio" class="form-select">
                                <option value="ACTIVO Y A PAZ Y SALVO" selected>ACTIVO Y A PAZ Y SALVO</option>
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="EN PROCESO DE MANTENIMIENTO">EN PROCESO DE MANTENIMIENTO</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">Fecha de Expedición:</label>
                            <input type="date" name="fecha_expedicion" value="{{ datetime }}" class="form-control" required>
                        </div>
                    </div>

                    <h5 class="text-primary mb-3 border-bottom pb-2 pt-2">Datos del Firmante</h5>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">Nombre del Firmante:</label>
                            <input type="text" name="nombre_firmante" value="ANGIE RUEDA ERAZO" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">Cargo del Firmante:</label>
                            <input type="text" name="cargo_firmante" value="Representante Legal" class="form-control" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="{{ url_for('documentos') }}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-success px-4">Generar Certificado</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</body>
</html>
